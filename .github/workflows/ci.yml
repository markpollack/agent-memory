name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Exact-SHA build proof from a non-default branch, once this file is on main.
  # GitHub only offers workflow_dispatch after the trigger exists on the default branch.
  workflow_dispatch:

jobs:
  build:
    uses: markpollack/build-tools/.github/workflows/ci-build.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      java-version: '17'

  consumer-resolution:
    name: Standalone consumer resolution
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Check standalone consumer Jackson floors
        run: ./scripts/check-consumer-resolution.sh
